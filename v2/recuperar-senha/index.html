<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar acesso — Desbloqueia Cursos</title>
  <meta name="description" content="Recuperação de acesso na demonstração V2 da Desbloqueia Cursos. Ambiente demonstrativo, sem envio real de e-mail.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/v2/assets/css/v2-main.css">
  <link rel="icon" href="/v2/assets/img/logo-v2.svg" type="image/svg+xml">
</head>
<body class="v2-app">

  <header class="v2-auth-header">
    <div class="v2-container v2-auth-header-inner">
      <a href="/v2/" class="v2-logo"><img src="/v2/assets/img/logo-v2.svg" alt="Desbloqueia Cursos"></a>
      <a href="/v2/login/" class="v2-btn v2-btn-ghost v2-btn-sm"><i class="ti ti-arrow-left"></i> Voltar para entrar</a>
    </div>
  </header>

  <main class="v2-main v2-authpage">
    <div class="v2-container">
      <div class="v2-auth-split v2-auth-split-single">
        <div class="v2-auth-card">
          <a href="/v2/" class="v2-auth-logo"><img src="/v2/assets/img/logo-v2.svg" alt="Desbloqueia Cursos"></a>
          <h1 class="v2-h2 v2-center">Recupere seu acesso</h1>
          <p class="v2-muted v2-center v2-sm" style="margin-bottom:20px;">Informe seu e-mail e enviaremos as instruções de recuperação.</p>

          <div id="rp-feedback" class="v2-callout" role="status" aria-live="polite" style="display:none;"></div>

          <form id="v2-recuperar-v2" novalidate>
            <div class="v2-field" id="rp-f-email">
              <label for="rp-email">E-mail</label>
              <input type="email" id="rp-email" class="v2-input" placeholder="seuemail@exemplo.com" autocomplete="email" aria-describedby="e-rp-email">
              <div class="v2-field-error" id="e-rp-email" aria-live="polite"></div>
            </div>
            <button type="submit" class="v2-btn v2-btn-primary v2-btn-block">Enviar instruções</button>
          </form>

          <div class="v2-callout v2-callout-info v2-auth-note"><i class="ti ti-info-circle"></i><span>Ambiente demonstrativo: nenhum e-mail é enviado de verdade.</span></div>
          <div class="v2-auth-foot"><a href="/v2/login/">Voltar para entrar</a></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/v2/data/cursos.js"></script>
  <script src="/v2/assets/js/v2-main.js"></script>
</body>
</html>
